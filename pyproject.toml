[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loomground-ingest"
dynamic = ["version"]
description = "The ingest plane of the Loomground workflow: multimodal input → a dimensioned subgraph in Versum (5D knowledge, nD governance)."
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSES/Apache-2.0.txt", "NOTICE"]
authors = [{ name = "Loomground Contributors" }]
# The built-in reference ingesters consume the language packs the same way
# solver's reference adapter consumes governance: the deontic ingester consumes
# loomground-deontic; the governance compiler consumes loomground-solver (for
# validate/parse/project/to_netlist) and loomground-governance (the authoritative
# policy grammar/vocabulary); bearer cleaning consumes loomground-factual's
# clean_entity (the shared NP-head primitive). Host-specific ingesters still
# live in their hosts.
# First-party siblings are direct git references, not ranges: no index serves this
# family. Each ref is the release tag loomground's RELEASES.json records, and the full
# transitive closure is declared, because those tagged commits still carry ranges that
# only these URLs can satisfy.
dependencies = [
    "loomground-deontic @ git+https://github.com/flxk1/loomground-deontic@0f57e8d2c02f288169d76e3ec93714b0d3f00ea2",
    "loomground-solver @ git+https://github.com/flxk1/loomground-solver@2cdf037882e3d867faa7e47e8f6b71a4dee0e38d",
    "loomground-governance @ git+https://github.com/flxk1/loomground-governance@ff2afcde03131859d21fc7195697e799aa65a9be",
    "loomground-factual @ git+https://github.com/flxk1/loomground-factual@ebf9fe19d518dde0aad08962632d95f9d97ee31c",
]

# Multi-language composition (enrich_subgraph / EnrichingWriter) is opt-in: the
# base pipeline stays pure-deontic, so the epistemic language is an OPTIONAL
# extra the base package does not install by default.
[project.optional-dependencies]
compose = [
    "loomground-epistemic @ git+https://github.com/flxk1/loomground-epistemic@10a3d6948eaf20092c49fc72efa98d43a5c2fca3",
]

[project.urls]
Homepage = "https://github.com/flxk1/loomground-ingest"
Source = "https://github.com/flxk1/loomground-ingest"

[tool.setuptools.packages.find]
where = ["src"]
include = ["loomground_ingest*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = { attr = "loomground_ingest._version.__version__" }
